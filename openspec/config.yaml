schema: spec-driven

context: |
  Project: bifrost — a minimal, self-healing WireGuard client container
  Language: Go 1.26, Linux-only (build-tagged)
  Architecture: CLI daemon with subcommands (healthcheck, handshake, genkey, pubkey, version)
  Key packages:
    - cmd/bifrost — entry point and subcommands
    - internal/config — env-based settings (BIFROST_*) and WireGuard .conf parsing
    - internal/supervisor — main loop watching handshake age + probe triggers
    - internal/recovery — escalating resolve→reconnect episodes with backoff
    - internal/probe — ICMP liveness probing and consecutive-failure state
    - internal/wg — WireGuard netlink device control (wgctrl)
  Build: static binary in scratch Docker image, version stamped via ldflags
  Testing: standard go test, no external test frameworks
  Style: minimal dependencies, no HTTP server, no frameworks, no CGO
  Conventions: conventional commits, CI via GitHub Actions

rules:
  proposal:
    - Keep proposals concise and focused on a single change
    - Always include a "Non-goals" section
    - Reference existing internal packages when relevant
  specs:
    - Describe behavior, not implementation details
    - Include failure modes and recovery behavior
  tasks:
    - Break tasks into chunks that modify at most 2-3 files each
    - Include test tasks alongside implementation tasks
