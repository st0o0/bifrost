name: Dev Build

on:
  pull_request:
    types: [labeled, synchronize, reopened]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'dev-build') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - run: echo "Dev build gate passed"

  docker:
    needs: gate
    uses: st0o0/github-workflows/.github/workflows/docker-dev.yml@main
    with:
      image-name: ghcr.io/st0o0/bifrost
      image-description: "Dev build of bifrost"
    permissions:
      packages: write
      pull-requests: write
