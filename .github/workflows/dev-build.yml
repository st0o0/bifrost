name: Dev Build

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docker:
    uses: st0o0/github-workflows/.github/workflows/go-dev-build.yml@main
    with:
      image-name: ghcr.io/st0o0/bifrost
      image-description: "Dev build of bifrost"
    permissions:
      contents: read
      packages: write
      pull-requests: write
