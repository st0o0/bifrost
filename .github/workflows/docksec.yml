name: DockSec

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: docksec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: st0o0/github-workflows/.github/workflows/docksec.yml@main
    permissions:
      contents: read
      security-events: write
