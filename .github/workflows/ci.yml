name: ci

# Validation runs on pull requests only. A PR is tested on its merge-result
# commit, so re-running the same checks on the post-merge push to main would be
# pure duplication — release.yml owns main. Enable branch protection ("require
# a pull request before merging") so every change to main is validated here.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.hadolint.yaml'
      - '.shellcheckrc'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

# One in-flight run per PR; pushing new commits cancels the superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "."
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Make scripts executable
        run: chmod +x tests/mocks/wg src/entrypoint.sh src/healthcheck.sh src/resolve.sh
      - name: Run unit tests
        run: bats tests/libhelpers.bats tests/lib.bats tests/healthcheck.bats tests/resolve.bats tests/entrypoint.bats

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: bifrost:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm --entrypoint sh bifrost:ci -c \
            'command -v wg && command -v wg-quick && command -v wireguard-go && ls /opt/bifrost'
          code=0
          docker run --rm bifrost:ci || code=$?
          test "$code" -eq 1

  # e2e is the slow job (~minutes) — only run it once the cheap checks pass.
  # The image build is a cache hit from the build job.
  e2e:
    needs: [lint, unit, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: bifrost:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run e2e
        run: |
          chmod +x tests/e2e/run.sh
          ./tests/e2e/run.sh
