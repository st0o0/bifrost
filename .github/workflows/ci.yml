name: ci

# Validation runs on pull requests only. A PR is tested on its merge-result
# commit, so re-running the same checks on the post-merge push to main would be
# pure duplication — release.yml owns main. Enable branch protection ("require
# a pull request before merging") so every change to main is validated here.
#
# No paths filter: these jobs are required checks, and a filtered-out workflow
# never reports, leaving the PR stuck on "Expected — waiting". The jobs are
# cheap enough to always run.
on:
  pull_request:

permissions:
  contents: read

# One in-flight run per PR; pushing new commits cancels the superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Named to match the branch-protection required checks: unit, lint, build, e2e.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # vet runs inside golangci-lint (govet is a default linter)
      - name: go test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: bifrost:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          out="$(docker run --rm bifrost:ci genkey)"
          test -n "$out"
          echo "genkey ok: $out"
          code=0
          docker run --rm bifrost:ci || code=$?
          test "$code" -eq 1

  # e2e is the slow job (~minutes) — only run it once the cheap checks pass.
  # The image build is a cache hit from the build job.
  e2e:
    needs: [unit, lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: bifrost:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run e2e
        run: |
          chmod +x tests/e2e/run.sh
          ./tests/e2e/run.sh
