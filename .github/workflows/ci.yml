name: ci

# Validation runs on pull requests only. A PR is tested on its merge-result
# commit, so re-running the same checks on the post-merge push to main would be
# pure duplication — release.yml owns main. Enable branch protection ("require
# a pull request before merging") so every change to main is validated here.
on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - '.golangci.yml'
      - '.hadolint.yaml'
      - 'tests/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

# One in-flight run per PR; pushing new commits cancels the superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: bifrost:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          out="$(docker run --rm bifrost:ci genkey)"
          test -n "$out"
          echo "genkey ok: $out"
          code=0
          docker run --rm bifrost:ci || code=$?
          test "$code" -eq 1

  # e2e is the slow job (~minutes) — only run it once the cheap checks pass.
  # The image build is a cache hit from the build job.
  e2e:
    needs: [test, lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: bifrost:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run e2e
        run: |
          chmod +x tests/e2e/run.sh
          ./tests/e2e/run.sh
